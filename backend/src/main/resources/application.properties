# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:woodash}
# Packaged deployments must provide DB_PASSWORD. Dev and test use the local container default.
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/woodash}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=${DB_POOL_ACQUISITION_TIMEOUT:5S}
%dev.quarkus.datasource.password=${DB_PASSWORD:woodash}
%test.quarkus.datasource.password=${DB_PASSWORD:woodash}

# Keep the API off 8080 so a reverse proxy can listen there.
quarkus.http.port=${HTTP_PORT:8081}
# Direct runs stay on loopback; Docker overrides this to 0.0.0.0 inside its private network.
quarkus.http.host=${HTTP_HOST:127.0.0.1}

# Swagger UI stays available in dev mode only.
quarkus.swagger-ui.always-include=false

# --- Flyway owns the schema, Hibernate only validates it ---
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate

# Packaged deployments must provide a random JWT_SECRET of at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
%dev.app.jwt.secret=${JWT_SECRET:woodashboard-dev-only-signing-secret-not-for-production-0123456789}
%test.app.jwt.secret=${JWT_SECRET:woodashboard-test-only-signing-secret-not-for-production-0123456789}
app.jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS:900}
