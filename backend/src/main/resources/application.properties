# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:woodash}
quarkus.datasource.password=${DB_PASSWORD:woodash}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/woodash}

# Keep the API off 8080 so a reverse proxy can listen there.
quarkus.http.port=${HTTP_PORT:8081}

# Include Swagger UI in production-mode packages (it is otherwise dev/test only).
quarkus.swagger-ui.always-include=true

# --- Flyway owns the schema, Hibernate only validates it ---
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate

# Set JWT_SECRET to a long, random value outside local development.
app.jwt.secret=${JWT_SECRET:woodashboard-local-development-signing-secret-change-me}
app.jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS:900}
